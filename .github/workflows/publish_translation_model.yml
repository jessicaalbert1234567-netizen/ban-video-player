name: Publish Translation Model Release

on:
  workflow_dispatch:
    inputs:
      package_source_url:
        description: 'Optional URL to download prebuilt translation_en_bn_v1.0.zip if not present on runner'
        required: false
        default: ''
      release_tag:
        description: 'Git Tag for the Release'
        required: true
        default: 'v1.0.0-translation-model'
      release_title:
        description: 'Title of the GitHub Release'
        required: true
        default: 'Offline English-Bangla Translation Model v1.0.0'
  push:
    tags:
      - 'v1.0.0-translation-model'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Obtain Prebuilt Model Package
        run: |
          mkdir -p dist
          PACKAGE="dist/translation_en_bn_v1.0.zip"
          if [ -f "$PACKAGE" ]; then
            echo "Prebuilt package found locally in runner workspace: $PACKAGE"
          elif [ -n "${{ github.event.inputs.package_source_url }}" ]; then
            echo "Downloading prebuilt package from supplied source URL: ${{ github.event.inputs.package_source_url }}..."
            curl -fSL "${{ github.event.inputs.package_source_url }}" -o "$PACKAGE"
          fi

          if [ ! -f "$PACKAGE" ]; then
            echo "::error::Prebuilt model package '$PACKAGE' is missing! Because large model binaries (>100MB) cannot be committed to Git repositories and 'dist/' is in .gitignore, a fresh GitHub Actions runner does not contain the ZIP asset."
            echo "::error::To publish this release:"
            echo "::error::  1) Trigger this workflow manually (workflow_dispatch) with 'package_source_url' pointing to the hosted model archive, OR"
            echo "::error::  2) Upload the release asset directly using GitHub CLI:"
            echo "::error::     gh release create v1.0.0-translation-model dist/translation_en_bn_v1.0.zip --title 'Offline English-Bangla Translation Model v1.0.0'"
            echo "MARKING WORKFLOW AS INCOMPLETE: Cannot publish release without authentic prebuilt asset."
            exit 1
          fi
          echo "Verified: Authentic package '$PACKAGE' is available for release."

      - name: Verify Exact Package Size
        run: |
          PACKAGE="dist/translation_en_bn_v1.0.zip"
          EXPECTED_SIZE=157681950
          ACTUAL_SIZE=$(stat -c %s "$PACKAGE")
          echo "Verifying exact file size..."
          echo "Expected size: $EXPECTED_SIZE bytes"
          echo "Actual size:   $ACTUAL_SIZE bytes"
          if [ "$ACTUAL_SIZE" -ne "$EXPECTED_SIZE" ]; then
            echo "::error::File size mismatch! Expected: $EXPECTED_SIZE bytes, Got: $ACTUAL_SIZE bytes"
            exit 1
          fi
          echo "Verification PASSED: File size is exactly $EXPECTED_SIZE bytes."

      - name: Verify Exact SHA-256 Checksum
        run: |
          PACKAGE="dist/translation_en_bn_v1.0.zip"
          EXPECTED_SHA="ff8b97888c8413c4ba2509e39a50234d040c6b894ab0a005f39bbd47595c0e27"
          echo "Calculating SHA-256 checksum for $PACKAGE..."
          ACTUAL_SHA=$(sha256sum "$PACKAGE" | awk '{print $1}')
          echo "Expected SHA-256: $EXPECTED_SHA"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA-256 checksum mismatch! Expected: $EXPECTED_SHA, Got: $ACTUAL_SHA"
            exit 1
          fi
          echo "Verification PASSED: SHA-256 is exactly $EXPECTED_SHA."

      - name: Determine Release Tag and Title
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Offline English-Bangla Translation Model ${TAG}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: false
          files: dist/translation_en_bn_v1.0.zip
          body: |
            ## MarianMT English → Bangla Neural Translation Model (INT8 ONNX)

            - **Architecture:** MarianMT Seq2Seq Transformer (Encoder + Autoregressive Decoder)
            - **Model Source:** `shhossain/opus-mt-en-to-bn` (Apache-2.0)
            - **Quantization:** Dynamic QUInt8 (INT8)
            - **Uncompressed Package Size:** 231,754,408 bytes (~221.0 MB)
            - **Compressed Archive Size:** 157,681,950 bytes (~150.4 MB)
            - **Archive Checksum (SHA-256):** `ff8b97888c8413c4ba2509e39a50234d040c6b894ab0a005f39bbd47595c0e27`

            ### Included Files:
            - `encoder_model.onnx` (51,062,030 bytes)
            - `decoder_model.onnx` (89,507,041 bytes)
            - `decoder_with_past_model.onnx` (86,295,092 bytes)
            - `source.spm` (801,944 bytes)
            - `target.spm` (969,253 bytes)
            - `vocab.json` (2,049,060 bytes)
            - `source_pieces.json` (1,067,467 bytes)
            - `model_manifest.json` (3,114 bytes)

            ### Direct Download URL:
            `https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/translation_en_bn_v1.0.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Resulting Public Asset URL
        run: |
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/translation_en_bn_v1.0.zip"
          echo "Verifying public asset URL: $ASSET_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$ASSET_URL")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Published asset is not publicly accessible! HTTP status: $HTTP_STATUS"
            exit 1
          fi
          echo "Verification SUCCESS: Public asset is accessible."

      - name: Print Final Direct Download URL
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/translation_en_bn_v1.0.zip"
          echo "=========================================================================="
          echo "FINAL DIRECT DOWNLOAD URL:"
          echo "$DOWNLOAD_URL"
          echo "=========================================================================="


