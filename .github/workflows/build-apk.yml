name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null || \
        sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Configure Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: offline-ai-dubbing-player-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
