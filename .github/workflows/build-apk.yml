name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null || \
        sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Configure Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare APK Asset
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ban-video-player-debug.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: offline-ai-dubbing-player-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          ban-video-player-debug.apk
        if-no-files-found: warn

    - name: Publish Direct Download Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Debug APK"
        draft: false
        prerelease: false
        body: |
          ## 📱 Offline AI Video Dubbing Player - Latest APK
          
          ### 🚀 Direct Download Link (Mobile / Android):
          Click below to download the `.apk` directly without extracting any zip file:
          - 📥 **[Download app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)**
          - 📥 **[Download ban-video-player-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/ban-video-player-debug.apk)**
          
          **Build details:**
          - **Commit:** `${{ github.sha }}`
          - **Date:** `${{ github.event.head_commit.timestamp }}`
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          ban-video-player-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
