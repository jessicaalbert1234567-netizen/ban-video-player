name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null || \
        sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Configure Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare APK Asset
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ban-video-player-debug.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: offline-ai-dubbing-player-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          ban-video-player-debug.apk
        if-no-files-found: warn

    - name: Publish Direct Download Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Offline AI Video Dubbing Player (v1.0.${{ github.run_number }})"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ## 📱 Offline AI Video Dubbing Player - APK Download
          
          ### 🚀 Direct APK Download Links (Mobile / Android):
          No need to unzip! Click the link below to download and install directly on your Android device:
          - 📥 **[Download ban-video-player-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/ban-video-player-debug.apk)**
          - 📥 **[Download app-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-debug.apk)**
          
          **Build Information:**
          - **Run Number:** `#${{ github.run_number }}`
          - **Commit:** `${{ github.sha }}`
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          ban-video-player-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Fallback Release using GitHub CLI
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      continue-on-error: true
      run: |
        TAG="v1.0.${{ github.run_number }}"
        gh release create "$TAG" ban-video-player-debug.apk app/build/outputs/apk/debug/app-debug.apk \
          --title "Offline AI Video Dubbing Player ($TAG)" \
          --notes "Direct APK download for Android devices." || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Actions Job Summary
      run: |
        echo "## 📱 Build Complete: Offline AI Dubbing Player" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Direct APK Download:" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to the repository **[Releases](https://github.com/${{ github.repository }}/releases)** tab." >> $GITHUB_STEP_SUMMARY
        echo "2. Download **ban-video-player-debug.apk** directly to your phone (no zip extraction needed!)." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚠️ If you downloaded the Artifact ZIP file:" >> $GITHUB_STEP_SUMMARY
        echo "The file from the Artifacts section is a **.zip** archive. Open it on your phone using any file manager (e.g., Google Files or ZArchiver), extract **app-debug.apk**, and tap to install." >> $GITHUB_STEP_SUMMARY
